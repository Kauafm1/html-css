<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e Quebra de linha.</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito. Basta colocar tudo entre as tags &lt;p&gt; e &lt;/p&gt;.</p> <lt = less than e gt = greater than>
    <p>Se você precisar de quebrar linhas,<br> use a tag &lt;br&gt;.</p>
    <p>vamos adicionar alguns símbolos especiais: <br>
        &copy;
        &reg;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uparrow;
        &uarr;
    </p>
    <p>Vamos adicionar alguns emojis:<br>
    &#x1F913;
    &#x270B;
    <codigos no emojipedia>
    
    </p>
</body>
</html>
