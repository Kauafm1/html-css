<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem de fundo</title>
    <style>
        body{
            background-image: url(imagens/wallpaper006.jpg);
            max-width: 970px;
            max-height: 760px;
        }

        div.quadrado{
            display: inline-block;
            border: 2px solid black;
            width: 300px;
            height: 300px;
            border-radius: 10px;
            background-color: lightgray;
            margin: auto;
            align-content: center;
        }
            div#q1 {
                background-color: skyblue;
            }

            div#q2{
                background-image: linear-gradient(to bottom, yellow, red);
            }

            div#q3{
                background-image: url(imagens/pattern001.png);
            }

            div#q4{
                text-align: center;
                font-size: 6em;
                background-image: url(imagens/pattern003.png);
            }
            
            div#q5{
                text-align: center;
                font-size: 6em;
                background-image: radial-gradient(lightblue, pink);
            }
    </style>
</head>
<body>
    <div class="quadrado" id="q1"></div>
    <div class="quadrado" id="q2"></div>
    <div class="quadrado" id="q3"></div>
    <div class="quadrado" id="q4">ROSA</div>
    <div class="quadrado" id="q5">LINDO</div>
</body>
</html>
